services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitakil -d instrument-manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - 3000:3000
    volumes:
      - calibcerts:/app/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      DB_SSL: "false"
      UPLOAD_DIR: ${UPLOAD_DIR}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  calibcerts:
